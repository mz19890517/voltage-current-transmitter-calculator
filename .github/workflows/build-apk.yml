name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androidbuild -keypass androidbuild \
            -dname "CN=Transmitter Calc, OU=Dev, O=Personal, L=Local, S=State, C=CN"
          chmod 600 release.jks

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: androidbuild
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: androidbuild
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmitter-calculator-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error